name: Probe price sources (temporary)

on:
  push:
    branches: [claude/update-steel-prices-K2F8l]
    paths: ['.github/probe/**', '.github/workflows/probe-sources.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r scripts/requirements.txt
      - name: Full analysis dry run (results uploaded as artifact, not committed)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/analyze.py
      - name: Report
        if: always()
        run: python .github/probe/report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dry-run-data, path: data/ }
