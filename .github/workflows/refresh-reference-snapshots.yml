name: Refresh public reference data
on:
  schedule:
    - cron: '13 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writer-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh source snapshots
        run: python scripts/refresh_reference_snapshots.py
      - name: Publish refreshed data
        run: |
          git config user.name "Steel Analysis Bot"
          git config user.email "steel-bot@users.noreply.github.com"
          git add data/laws/reference-archive/source-snapshots.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh public reference snapshots"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
