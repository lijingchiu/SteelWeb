name: Daily Steel Price Analysis

on:
  schedule:
    # 00:00 UTC = 08:00 Taiwan Time (CST, UTC+8)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force re-run even if data already exists today'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  analyze:
    name: Fetch & Analyze Steel Prices
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Check if analysis already exists today
        id: check_today
        run: |
          DATE=$(TZ='Asia/Taipei' date +%Y-%m-%d)
          echo "today=$DATE" >> $GITHUB_OUTPUT
          if [ -f "data/history/${DATE}.json" ] && [ "${{ github.event.inputs.force_run }}" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Analysis for ${DATE} already exists, skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run steel price analysis
        if: steps.check_today.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/analyze.py

      - name: Commit and push updated data
        if: steps.check_today.outputs.skip != 'true'
        run: |
          git config user.name "Steel Analysis Bot"
          git config user.email "steel-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: steel price analysis ${{ steps.check_today.outputs.today }}"
            git push origin main
          fi

      - name: Summary
        run: |
          echo "### Analysis Results" >> $GITHUB_STEP_SUMMARY
          if [ -f data/latest.json ]; then
            DATE=$(python3 -c "import json; d=json.load(open('data/latest.json')); print(d.get('date','?'))")
            CONF=$(python3 -c "import json; d=json.load(open('data/latest.json')); print(d.get('confidence','?'))")
            echo "- **Date**: $DATE" >> $GITHUB_STEP_SUMMARY
            echo "- **Confidence**: $CONF" >> $GITHUB_STEP_SUMMARY
            echo "- **Model**: $(python3 -c "import json; d=json.load(open('data/latest.json')); print(d.get('model_used','?'))")" >> $GITHUB_STEP_SUMMARY
          else
            echo "No data file found." >> $GITHUB_STEP_SUMMARY
          fi
