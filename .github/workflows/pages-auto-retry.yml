name: Auto-retry failed Pages deployment

# GitHub Pages' internal deploy step intermittently fails with
# "Deployment failed, try again later" even though the build succeeds.
# A manual Re-run always fixes it, so this workflow does that
# automatically: when a "pages build and deployment" run completes with
# failure, wait a minute and re-run its failed jobs (up to 3 attempts).

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait before retrying
        run: sleep 60

      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"
          echo "Re-ran failed jobs for run ${{ github.event.workflow_run.id }} (attempt ${{ github.event.workflow_run.run_attempt }} failed)"
