name: Build Newsletter Deck

# Rebuilds the daily newsletter deck from the current analysis without re-running
# the analysis itself. The daily workflow builds it automatically; this is for
# rebuilding on demand (push a change to the trigger file on main).
on:
  push:
    branches: [main]
    paths: ['.github/trigger/build-report']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: data-writer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Install PDF conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-noto-cjk fonts-liberation fontconfig
      - name: Build deck
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/report.py
      - name: Commit deck
        run: |
          git config user.name "Steel Analysis Bot"
          git config user.email "steel-bot@users.noreply.github.com"
          git add data/report.json reports/
          if git diff --cached --quiet; then echo "No deck produced"; exit 0; fi
          git commit -m "data: newsletter deck $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Request Pages publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
